<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader &amp; AI Notes</title>
    <style>
        :root {
            --text: #f8fafc;
            --muted: rgba(226, 232, 240, 0.72);
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.18);
            --accent: #6366f1;
            --accent2: #06b6d4;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background: #0b1020;
            overflow-x: hidden;
        }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .hidden { display: none !important; }

        /* ---------- Background ---------- */
        .bg {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
            background:
                radial-gradient(1200px 800px at 10% -10%, #1e1b4b 0%, transparent 60%),
                radial-gradient(1000px 700px at 110% 10%, #0c4a6e 0%, transparent 55%),
                #0b1020;
        }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; animation: float 18s ease-in-out infinite; }
        .b1 { width: 420px; height: 420px; background: #6366f1; top: -80px; left: -60px; }
        .b2 { width: 380px; height: 380px; background: #06b6d4; top: 30%; right: -100px; animation-delay: -6s; }
        .b3 { width: 340px; height: 340px; background: #a855f7; bottom: -100px; left: 25%; animation-delay: -12s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.1); }
        }

        /* ---------- Layout ---------- */
        .wrap { max-width: 900px; margin: 0 auto; padding: 40px 18px 56px; }
        .hero { text-align: center; margin-bottom: 28px; }
        .logo {
            width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px;
            display: grid; place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45);
        }
        .logo .ico { width: 28px; height: 28px; }
        .hero h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -0.02em; }
        .hero p { margin: 0; color: var(--muted); font-size: 1rem; }

        .glass {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            backdrop-filter: blur(22px) saturate(160%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass { background: rgba(30, 41, 59, 0.92); }
        }
        .panel { padding: 22px; margin-bottom: 20px; }

        /* ---------- Form ---------- */
        .url-row { display: flex; gap: 12px; }
        input[type="url"] {
            flex: 1; min-width: 0; padding: 13px 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border);
            color: var(--text); font: inherit; font-size: 0.97rem;
        }
        input::placeholder { color: rgba(226, 232, 240, 0.5); }
        .hint { margin: 10px 2px 0; color: var(--muted); font-size: 0.85rem; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 20px; border-radius: 12px; border: 1px solid transparent;
            font: inherit; font-weight: 600; font-size: 0.95rem; color: #fff; cursor: pointer;
            transition: transform 0.15s, background 0.15s, opacity 0.15s;
            white-space: nowrap;
        }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); }
        .btn.soft { background: rgba(255, 255, 255, 0.1); border-color: var(--border); }
        .btn.soft:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); }
        .btn.ghost { background: none; color: var(--muted); padding: 8px 10px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
        .btn.ghost:hover:not(:disabled) { color: #fff; transform: none; }
        .btn:focus-visible, input:focus-visible { outline: 2px solid #67e8f9; outline-offset: 2px; }
        .ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

        /* ---------- Status ---------- */
        .status { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; font-size: 0.92rem; color: var(--muted); white-space: pre-wrap; }
        .status.error { color: #fca5a5; }
        .status.success { color: #86efac; }
        .spinner {
            width: 16px; height: 16px; margin-top: 2px; border-radius: 50%; flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.25); border-top-color: #67e8f9; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Video card ---------- */
        .vcard { display: grid; grid-template-columns: 300px 1fr; gap: 22px; padding: 18px; margin-bottom: 20px; align-items: center; }
        .thumb-wrap {
            position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(6, 182, 212, 0.4));
            border: 1px solid var(--border);
        }
        .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge {
            position: absolute; right: 8px; bottom: 8px; padding: 2px 8px; border-radius: 6px;
            background: rgba(0, 0, 0, 0.7); font-size: 0.78rem; font-weight: 600;
        }
        .vinfo h3 { margin: 0 0 6px; font-size: 1.15rem; line-height: 1.35; }
        .vinfo .meta { margin: 0 0 16px; color: var(--muted); font-size: 0.88rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

        /* ---------- Notes ---------- */
        .notes { padding: 26px; }
        .notes-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
        .notes-head h2 { margin: 8px 0 0; font-size: 1.4rem; line-height: 1.3; letter-spacing: -0.01em; }
        .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); border: 1px solid var(--border); font-size: 0.76rem; color: var(--muted); }
        .sec { margin-bottom: 22px; }
        .sec:last-child { margin-bottom: 0; }
        .sec h3 { margin: 0 0 10px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: #67e8f9; }
        .sec p { margin: 0; line-height: 1.7; font-size: 0.98rem; }
        .topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
        .topic { padding: 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); }
        .topic h4 { margin: 0 0 8px; font-size: 1rem; }
        .notes ul { margin: 0; padding-left: 20px; }
        .notes li { line-height: 1.6; font-size: 0.94rem; margin-bottom: 5px; }
        .notes li::marker { color: #818cf8; }
        .defs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
        .def { padding: 14px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); }
        .def b { display: block; margin-bottom: 4px; color: #c7d2fe; }
        .def span { color: var(--muted); font-size: 0.92rem; line-height: 1.55; }
        .disclaimer { margin: 22px 0 0; color: var(--muted); font-size: 0.8rem; }

        footer { text-align: center; color: rgba(226, 232, 240, 0.45); font-size: 0.8rem; margin-top: 30px; }

        /* ---------- Responsive ---------- */
        @media (max-width: 720px) {
            .vcard { grid-template-columns: 1fr; }
            .url-row { flex-direction: column; }
            .notes-head { flex-direction: column; }
            .actions .btn:not(.ghost) { flex: 1 1 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .blob, .spinner { animation: none; }
            .btn { transition: none; }
        }
    </style>
</head>
<body>
    <div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <main class="wrap">
        <header class="hero">
            <div class="logo">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
            </div>
            <h1>Video Downloader &amp; AI Notes</h1>
            <p>Paste a video link to download it or turn it into clear study notes.</p>
        </header>

        <!-- Link input -->
        <section class="glass panel">
            <form id="urlForm" class="url-row">
                <label class="sr-only" for="urlInput">Video link</label>
                <input type="url" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." required>
                <button type="submit" class="btn primary" id="fetchBtn">
                    Get Video
                    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </form>
            <p class="hint">Works with YouTube, Instagram and Facebook links.</p>
            <div id="status" class="status hidden" role="status" aria-live="polite">
                <span id="spinner" class="spinner hidden"></span>
                <span id="statusText"></span>
            </div>
        </section>

        <!-- Video card -->
        <section id="card" class="glass vcard hidden">
            <div class="thumb-wrap">
                <img id="thumb" alt="Video thumbnail">
                <span id="durBadge" class="badge hidden"></span>
            </div>
            <div class="vinfo">
                <h3 id="title"></h3>
                <p class="meta" id="meta"></p>
                <div class="actions">
                    <button id="dlSumBtn" class="btn primary">
                        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Download &amp; Summarize
                    </button>
                    <button id="sumBtn" class="btn soft">
                        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        Summarize without downloading
                    </button>
                    <button id="dlOnlyBtn" class="btn ghost">Download only</button>
                </div>
            </div>
        </section>

        <!-- AI notes -->
        <section id="notes" class="glass notes hidden">
            <div class="notes-head">
                <div>
                    <span id="srcBadge" class="pill"></span>
                    <h2 id="notesTitle"></h2>
                </div>
                <button id="pdfBtn" class="btn primary">
                    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Download PDF
                </button>
            </div>
            <div id="notesBody"></div>
            <p class="disclaimer">Notes are generated by AI and may contain mistakes. Check important details against the video.</p>
        </section>

        <footer>Use only with videos you have the right to save.</footer>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        let current = null;        // { url, title }
        let currentNotes = null;   // last generated notes

        const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const shorten = (s, n = 300) => (s.length > n ? s.slice(0, n) + '…' : s);
        const safeName = (t) => (String(t).replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 80) || 'video');

        // ---------- status ----------
        function setStatus(msg, type = '', loading = false) {
            $('status').classList.toggle('hidden', !msg);
            $('status').className = 'status' + (type ? ' ' + type : '') + (msg ? '' : ' hidden');
            $('spinner').classList.toggle('hidden', !loading);
            $('statusText').textContent = msg;
        }

        function setBusy(busy) {
            ['fetchBtn', 'dlSumBtn', 'sumBtn', 'dlOnlyBtn'].forEach((id) => { $(id).disabled = busy; });
        }

        function hideNotes() {
            $('notes').classList.add('hidden');
            $('notesBody').innerHTML = '';
            currentNotes = null;
        }

        // ---------- 1. Get video info and show the card ----------
        $('urlForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = $('urlInput').value.trim();

            $('card').classList.add('hidden');
            hideNotes();
            current = null;
            setStatus('Fetching video info…', '', true);
            setBusy(true);

            try {
                const res = await fetch('/info?url=' + encodeURIComponent(url));
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Could not read the video.');

                current = { url, title: data.title };
                $('title').textContent = data.title;
                $('meta').textContent = data.uploader || '';

                if (data.thumbnail) { $('thumb').src = data.thumbnail; $('thumb').classList.remove('hidden'); }
                else { $('thumb').removeAttribute('src'); $('thumb').classList.add('hidden'); }

                $('durBadge').textContent = data.duration || '';
                $('durBadge').classList.toggle('hidden', !data.duration);

                $('card').classList.remove('hidden');
                setStatus('');
            } catch (err) {
                setStatus(shorten(err.message), 'error');
            } finally {
                setBusy(false);
            }
        });

        // ---------- actions ----------
        async function getNotes() {
            const res = await fetch('/summarize?url=' + encodeURIComponent(current.url));
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Could not summarize the video.');
            return data;
        }

        async function downloadVideo() {
            const res = await fetch('/download?url=' + encodeURIComponent(current.url));
            if (!res.ok) throw new Error((await res.text()) || 'Download failed.');
            const blob = await res.blob();
            const href = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = href;
            a.download = safeName(current.title) + '.mp4';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(href), 10000);
        }

        function renderNotes(d) {
            currentNotes = d;
            const list = (items) => `<ul>${(items || []).map((p) => `<li>${esc(p)}</li>`).join('')}</ul>`;

            $('srcBadge').textContent = d.source === 'audio'
                ? 'Made from the video audio (no captions found)'
                : 'Made from the video captions';
            $('notesTitle').textContent = d.title || current.title;

            const parts = [];
            if (d.summary) parts.push(`<div class="sec"><h3>Summary</h3><p>${esc(d.summary)}</p></div>`);
            if ((d.headings || []).length) {
                parts.push(`<div class="sec"><h3>Topics covered</h3><div class="topics">${
                    d.headings.map((h) => `<div class="topic"><h4>${esc(h.heading)}</h4>${list(h.points)}</div>`).join('')
                }</div></div>`);
            }
            if ((d.key_points || []).length) parts.push(`<div class="sec"><h3>Key points</h3>${list(d.key_points)}</div>`);
            if ((d.definitions || []).length) {
                parts.push(`<div class="sec"><h3>Definitions</h3><div class="defs">${
                    d.definitions.map((x) => `<div class="def"><b>${esc(x.term)}</b><span>${esc(x.meaning)}</span></div>`).join('')
                }</div></div>`);
            }

            $('notesBody').innerHTML = parts.join('');
            $('notes').classList.remove('hidden');
            $('notes').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Button 1: Download & Summarize
        $('dlSumBtn').addEventListener('click', async () => {
            if (!current) return;
            setBusy(true);
            hideNotes();
            let notesError = '';

            try {
                setStatus('Step 1 of 2: writing notes… (1–3 minutes if the video has no captions)', '', true);
                renderNotes(await getNotes());
            } catch (err) {
                notesError = shorten(err.message);
            }

            try {
                setStatus('Step 2 of 2: downloading the video… your browser will save it when it is ready.', '', true);
                await downloadVideo();
                if (notesError) setStatus('Video saved, but the notes failed: ' + notesError, 'error');
                else setStatus('Done. The notes are ready and the video was saved.', 'success');
            } catch (err) {
                setStatus('Download failed: ' + shorten(err.message) + (notesError ? '\nNotes also failed: ' + notesError : ''), 'error');
            } finally {
                setBusy(false);
            }
        });

        // Button 2: Summarize without downloading
        $('sumBtn').addEventListener('click', async () => {
            if (!current) return;
            setBusy(true);
            hideNotes();
            setStatus('Writing notes… (1–3 minutes if the video has no captions)', '', true);
            try {
                renderNotes(await getNotes());
                setStatus('Done. No video file was downloaded.', 'success');
            } catch (err) {
                setStatus(shorten(err.message), 'error');
            } finally {
                setBusy(false);
            }
        });

        // Small link: Download only
        $('dlOnlyBtn').addEventListener('click', async () => {
            if (!current) return;
            setBusy(true);
            setStatus('Downloading the video… your browser will save it when it is ready.', '', true);
            try {
                await downloadVideo();
                setStatus('Video saved.', 'success');
            } catch (err) {
                setStatus('Download failed: ' + shorten(err.message), 'error');
            } finally {
                setBusy(false);
            }
        });

        // ---------- PDF (built in the browser, nothing is saved on the server) ----------
        // jsPDF's built-in font only supports Latin characters, so anything else is replaced.
        function pdfSafe(s) {
            return String(s ?? '')
                .replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
                .replace(/[\u2013\u2014]/g, '-').replace(/\u2026/g, '...').replace(/[\u2022\u25CF]/g, '-')
                .replace(/\u2192/g, '->')
                .replace(/[^\x20-\x7E\xA0-\xFF\n]/g, '?');
        }

        $('pdfBtn').addEventListener('click', () => {
            if (!currentNotes) return;
            const lib = window.jspdf;
            if (!lib || !lib.jsPDF) {
                setStatus('The PDF library could not load. Check your internet connection and reload the page.', 'error');
                return;
            }

            const doc = new lib.jsPDF({ unit: 'pt', format: 'a4' });
            const W = doc.internal.pageSize.getWidth();
            const H = doc.internal.pageSize.getHeight();
            const M = 56;
            const CW = W - M * 2;
            let y = M;

            const ensure = (h) => { if (y + h > H - M) { doc.addPage(); y = M; } };

            function write(text, o = {}) {
                const { size = 11, style = 'normal', color = [30, 41, 59], indent = 0, gap = 0 } = o;
                doc.setFont('helvetica', style);
                doc.setFontSize(size);
                doc.setTextColor(...color);
                const step = size * 1.45;
                doc.splitTextToSize(pdfSafe(text), CW - indent).forEach((line) => {
                    ensure(step);
                    doc.text(line, M + indent, y + size);
                    y += step;
                });
                y += gap;
            }

            function bullet(text, size = 11) {
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(size);
                const step = size * 1.45;
                doc.splitTextToSize(pdfSafe(text), CW - 18).forEach((line, i) => {
                    ensure(step);
                    if (i === 0) { doc.setFillColor(99, 102, 241); doc.circle(M + 5, y + size * 0.65, 1.8, 'F'); }
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(size);
                    doc.setTextColor(30, 41, 59);
                    doc.text(line, M + 18, y + size);
                    y += step;
                });
                y += 3;
            }

            function heading(text) {
                ensure(46);
                y += 10;
                write(text, { size: 14, style: 'bold', color: [67, 56, 202], gap: 2 });
                doc.setDrawColor(199, 210, 254);
                doc.line(M, y, M + CW, y);
                y += 10;
            }

            // Title band
            const titleText = currentNotes.title || current.title;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(20);
            const titleLines = doc.splitTextToSize(pdfSafe(titleText), CW).slice(0, 3);
            const bandH = 34 + titleLines.length * 26 + 34;
            doc.setFillColor(30, 27, 75);
            doc.rect(0, 0, W, bandH, 'F');
            doc.setTextColor(255, 255, 255);
            titleLines.forEach((l, i) => doc.text(l, M, 46 + i * 26));
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.setTextColor(199, 210, 254);
            doc.text('Video notes  |  ' + new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }), M, bandH - 18);
            y = bandH + 24;

            write('Source: ' + current.url, { size: 9, color: [100, 116, 139], gap: 6 });

            const d = currentNotes;
            if (d.summary) { heading('Summary'); write(d.summary, { gap: 4 }); }

            if ((d.headings || []).length) {
                heading('Topics covered');
                d.headings.forEach((h) => {
                    ensure(40);
                    write(h.heading, { size: 12, style: 'bold', color: [15, 23, 42], gap: 2 });
                    (h.points || []).forEach((p) => bullet(p));
                    y += 6;
                });
            }

            if ((d.key_points || []).length) {
                heading('Key points');
                d.key_points.forEach((p) => bullet(p));
            }

            if ((d.definitions || []).length) {
                heading('Definitions');
                d.definitions.forEach((x) => {
                    ensure(44);
                    write(x.term, { style: 'bold', color: [15, 23, 42] });
                    write(x.meaning, { indent: 12, gap: 6 });
                });
            }

            // Footer on every page
            const pages = doc.getNumberOfPages();
            for (let i = 1; i <= pages; i++) {
                doc.setPage(i);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8.5);
                doc.setTextColor(120, 130, 150);
                doc.text('AI-generated notes. Check important details against the video.', M, H - 28);
                doc.text(`Page ${i} of ${pages}`, W - M, H - 28, { align: 'right' });
            }

            doc.save(safeName(titleText) + ' - notes.pdf');
        });
    </script>
</body>
</html>
